name: tests

on:
  push:
  pull_request:
  schedule:
    - cron: '17 6 * * 1'

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v

  weekly-source-scan:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python main.py investigar-fuentes "naufragio Canarias" --online > source-scan.json
      - uses: actions/upload-artifact@v4
        with:
          name: source-scan
          path: source-scan.json

